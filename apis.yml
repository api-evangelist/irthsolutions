name: Irth Solutions
description: >-
  Irth Solutions is a SaaS platform provider for critical-infrastructure damage prevention,
  asset (pipeline) integrity, and stakeholder land management, trusted by energy, utility, and
  telecom operators across the U.S. and Canada since 1995. Its products include 811 ticket
  management (UtiliSphere, Exactix, and 811spotter for contractors), one-call center notification,
  intelligent forms and workflows, inline-inspection and corrosion/crack asset-integrity analytics,
  and lease, royalty, and right-of-way land management, powered by business intelligence, analytics,
  and geospatial data. Irth exposes a RESTful Integration API (Irthnet / UtiliSphere) secured with a
  per-integration API key for creating and modifying users, map layers, and work items in real time.
